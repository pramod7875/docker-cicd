name: Docker CI

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t myweb:v1 .

    - name: Login DockerHub
      run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

    - name: Tag image
      run: docker tag myweb:v1 pramodpawar7875/myweb:v1

    - name: Push image
      run: docker push pramodpawar7875/myweb:v1
